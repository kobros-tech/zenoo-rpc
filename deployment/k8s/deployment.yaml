# Zenoo RPC - MCP HTTP Server Kubernetes Deployment
# Deploy with: kubectl apply -f deployment.yaml
#
# Prerequisites:
# 1. Create namespace: kubectl create namespace zenoo-mcp
# 2. Create secrets:
#    kubectl create secret generic zenoo-mcp-secrets \
#      --namespace=zenoo-mcp \
#      --from-literal=MCP_API_KEYS=your-api-key \
#      --from-literal=ODOO_URL=https://your-odoo.com \
#      --from-literal=ODOO_DATABASE=your-db \
#      --from-literal=ODOO_USERNAME=admin \
#      --from-literal=ODOO_PASSWORD=your-password

---
apiVersion: v1
kind: Namespace
metadata:
  name: zenoo-mcp
  labels:
    app: zenoo-mcp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenoo-mcp
  namespace: zenoo-mcp
  labels:
    app: zenoo-mcp
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zenoo-mcp
  template:
    metadata:
      labels:
        app: zenoo-mcp
        version: v1
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: zenoo-mcp
        # IMAGE_PLACEHOLDER is replaced by CI/CD pipeline
        # For local minikube, use: zenoo-mcp:latest (after building locally)
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        # MCP HTTP Server Configuration
        - name: MCP_PORT
          value: "8080"
        - name: MCP_HOST
          value: "0.0.0.0"
        - name: LOG_LEVEL
          value: "INFO"
        # Secrets from Kubernetes Secret
        - name: MCP_API_KEYS
          valueFrom:
            secretKeyRef:
              name: zenoo-mcp-secrets
              key: MCP_API_KEYS
        - name: ODOO_URL
          valueFrom:
            secretKeyRef:
              name: zenoo-mcp-secrets
              key: ODOO_URL
        - name: ODOO_DATABASE
          valueFrom:
            secretKeyRef:
              name: zenoo-mcp-secrets
              key: ODOO_DATABASE
        - name: ODOO_USERNAME
          valueFrom:
            secretKeyRef:
              name: zenoo-mcp-secrets
              key: ODOO_USERNAME
        - name: ODOO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zenoo-mcp-secrets
              key: ODOO_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

# Secrets are created by CI/CD pipeline using kubectl create secret
# DO NOT add secrets to this file - they are managed via GitLab CI/CD variables
