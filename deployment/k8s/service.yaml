# Zenoo RPC - MCP HTTP Server Kubernetes Service
# Exposes the MCP HTTP server on port 8080

---
apiVersion: v1
kind: Service
metadata:
  name: zenoo-mcp
  namespace: zenoo-mcp
  labels:
    app: zenoo-mcp
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: zenoo-mcp

---
# NodePort Service (alternative for minikube)
# Use: minikube service zenoo-mcp-nodeport -n zenoo-mcp
apiVersion: v1
kind: Service
metadata:
  name: zenoo-mcp-nodeport
  namespace: zenoo-mcp
  labels:
    app: zenoo-mcp
spec:
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  selector:
    app: zenoo-mcp

---
# Ingress for routing via NGINX Ingress Controller
# This allows using the stable Ingress Controller IP (157.230.65.187)
# instead of the dynamic LoadBalancer IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zenoo-mcp-ingress
  namespace: zenoo-mcp
  labels:
    app: zenoo-mcp
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  rules:
  - host: dev.kobros-tech.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zenoo-mcp
            port:
              number: 8080
